<!-- Action Button -->
<button id="convertBtn" onclick="processConversion()" class="w-full py-4 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-slate-950 font-bold rounded-xl transition-all shadow-lg shadow-green-500/25 flex items-center justify-center space-x-2">
  <i class="fa-solid fa-rotate text-lg"></i>
  <span>Start Conversion</span>
</button>

<!-- Conversion Progress & Download Section -->
<div id="progressBox" class="hidden mt-6 pt-6 border-t border-slate-800 space-y-4">
  <div>
    <div class="flex justify-between text-sm mb-2">
      <span id="statusText" class="text-slate-300 font-medium">Processing audio stream...</span>
      <span id="progressPercent" class="text-green-400 font-bold">0%</span>
    </div>
    <div class="w-full bg-slate-900 h-3 rounded-full overflow-hidden border border-slate-800">
      <div id="progressBar" class="bg-gradient-to-r from-green-500 to-emerald-400 h-full w-0 transition-all duration-300"></div>
    </div>
  </div>

  <!-- Dito lilitaw ang Download Button kapag tapos na -->
  <div id="downloadContainer" class="hidden">
    <a id="downloadBtn" href="#" download="converted-audio.mp3" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition-all flex items-center justify-center space-x-2 shadow-lg shadow-blue-500/25">
      <i class="fa-solid fa-download"></i>
      <span>Download MP3 File</span>
    </a>
  </div>
</div>
